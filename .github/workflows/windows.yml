name: Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch pushes cancel the in-flight run instead of burning a full
# Windows build on a commit that is already obsolete. Tag refs each get their
# own group, so release builds are never cancelled by unrelated pushes.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-2022
    # A hung test process must cost one job, not a runner lease. Kept well above the
    # observed full build plus suite duration so a slow but healthy run never trips it.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          submodules: recursive

      - name: Check release version
        id: version
        timeout-minutes: 5
        run: |
          $cmakeContents = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match(
            $cmakeContents,
            '(?s)project\s*\(\s*AirPodsWindows\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          )
          if (-not $match.Success) {
            throw 'Unable to read the project version from CMakeLists.txt.'
          }

          $version = $match.Groups[1].Value
          $manifestVersion = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          if ($version -ne $manifestVersion) {
            throw "CMake version $version does not match vcpkg version $manifestVersion."
          }

          # Accept both tag conventions: releases before v0.5.0 are tagged without the `v`.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and
              $env:GITHUB_REF_NAME -ne "v$version" -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME matches neither v$version nor $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        timeout-minutes: 25
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # The whole vcpkg checkout (including the bootstrapped vcpkg.exe) is
      # reused across runs; runners are same-platform so the tool stays valid.
      # v2: the v1 entry may hold a --depth 1 checkout saved by a failed run
      # (actions/cache saves on failure too), which cannot serve the baseline.
      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        timeout-minutes: 15
        with:
          path: Build/vcpkg
          key: vcpkg-v2-${{ hashFiles('vcpkg.json') }}

      # Full history required: vcpkg.json pins builtin-baseline to a specific
      # commit and vcpkg `git show`s it, which a --depth 1 clone cannot serve.
      # The cache above keeps the full checkout warm so this only runs when the
      # baseline (vcpkg.json) changes.
      - name: Clone and bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          git clone https://github.com/microsoft/vcpkg.git Build/vcpkg
          & Build/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        # NOTE: no CMAKE_<LANG>_COMPILER_LAUNCHER (sccache) here — the Visual
        # Studio generator ignores the launcher property entirely (verified:
        # a fake launcher is never invoked, and sccache reported 0 compile
        # requests). Only Makefile/Ninja generators honor it.
        timeout-minutes: 20
        run: |
          cmake -S . -B Build/Release `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Build/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR `
            -DAPD_BUILD_TESTS=ON `
            -DAPD_GENERATE_INSTALLER=ON `
            -DAPD_GITHUB_OWNER=${{ github.repository_owner }} `
            -DAPD_GITHUB_REPOSITORY=${{ github.event.repository.name }} `
            -DAPD_BUILD_GIT_HASH=${{ github.sha }}

      - name: Build
        timeout-minutes: 60
        run: cmake --build Build/Release --config $env:BUILD_TYPE --parallel 2

      - name: Test
        # --timeout 60 bounds each test (Tests/CMakeLists.txt sets the same property, so
        # the ceiling also holds for a manual ctest run); --no-tests=error turns an empty
        # or mis-registered suite into a failure instead of a silent pass.
        timeout-minutes: 25
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File Tests/InstallerOrderingGateTests.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Installer ordering fixtures failed with exit code $LASTEXITCODE."
          }
          $uiLog = Join-Path $env:RUNNER_TEMP 'UiRenderingTests.txt'
          $ui = Start-Process `
            -FilePath 'Build/Release/Binary/UiRenderingTests.exe' `
            -ArgumentList @('-o', "$uiLog,txt") `
            -NoNewWindow -PassThru
          if (-not $ui.WaitForExit([TimeSpan]::FromMinutes(10).TotalMilliseconds)) {
            $ui.Kill()
            throw 'UiRenderingTests did not finish within 10 minutes; killed instead of hanging.'
          }
          $uiExitCode = $ui.ExitCode
          if ($uiExitCode -ne 0) {
            Get-Content -LiteralPath $uiLog
            throw "UiRenderingTests failed with exit code $uiExitCode."
          }
          ctest --test-dir Build/Release -C $env:BUILD_TYPE `
            --exclude-regex '^UiRenderingTests$' `
            --timeout 60 `
            --no-tests=error `
            --output-on-failure
          $ctestExit = $LASTEXITCODE
          if ($ctestExit -ne 0) {
            # QTest console output does not survive the ctest pipe (the PASS/FAIL
            # lines never reach the log), so every suite writes a .txt report into
            # Testing/ and we dump them here to see the actual failing assertions.
            Get-ChildItem 'Build/Release/Testing/*.txt' -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "::group::Test report $($_.Name)"
                Get-Content -LiteralPath $_.FullName
                Write-Host '::endgroup::'
              }
            throw "ctest failed with exit code $ctestExit."
          }

      - name: Package release assets
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem `
            Build/Release/Installer/AirPodsWindows-*-win64.exe |
            Select-Object -First 1
          if (-not $installer) {
            throw 'The NSIS installer was not generated.'
          }

          # Monolithic packaging puts the staged runtime files at the package root.
          $portableSource =
            "Build/Release/Installer/_CPack_Packages/win64/NSIS/AirPodsWindows-$env:VERSION-win64"
          if (-not (Test-Path -LiteralPath $portableSource)) {
            throw "Portable package directory not found: $portableSource"
          }

          # The installer has to close a running copy before it copies any file. Where CPack
          # places that step depends on how the package is laid out, so check the script itself.
          $installerScript = Get-Content -LiteralPath `
            'Build/Release/Installer/_CPack_Packages/win64/NSIS/project.nsi'

          # Strip NSIS comments without removing lines, so matches still report the
          # original project.nsi line numbers. Comment markers in quoted strings are text.
          $inBlockComment = $false
          $quote = $null
          $executableScript = foreach ($line in $installerScript) {
            $code = [System.Text.StringBuilder]::new()
            for ($index = 0; $index -lt $line.Length; $index++) {
              $character = $line[$index]
              if ($inBlockComment) {
                if ($character -eq '*' -and $index + 1 -lt $line.Length -and
                    $line[$index + 1] -eq '/') {
                  $inBlockComment = $false
                  $index++
                }
                [void]$code.Append(' ')
                continue
              }
              if ($quote) {
                [void]$code.Append($character)
                if ($character -eq $quote -and
                    ($index -lt 2 -or $line[$index - 1] -ne '\' -or $line[$index - 2] -ne '$')) {
                  $quote = $null
                }
                continue
              }
              if ($character -eq '"' -or $character -eq "'" -or $character -eq '`') {
                $quote = $character
              }
              elseif ($character -eq ';') {
                break
              }
              elseif ($character -eq '/' -and $index + 1 -lt $line.Length -and
                      $line[$index + 1] -eq '*') {
                $inBlockComment = $true
                $index++
                [void]$code.Append(' ')
                continue
              }
              [void]$code.Append($character)
            }
            $code.ToString()
          }

          $openMutexLine = ($executableScript |
            Select-String -Pattern '^\s*System::Call .*kernel32::OpenMutexW\(.*Global\\AirPodsWindows_InstanceMutex' |
            Select-Object -First 1).LineNumber
          $taskkillLine = ($executableScript |
            Select-String -Pattern '^\s*nsExec::Exec .*taskkill\.exe.*AirPodsWindows\.exe' |
            Select-Object -First 1).LineNumber
          $copyLine = ($executableScript |
            Select-String -Pattern '^\s*File /r ' |
            Select-Object -First 1).LineNumber
          if (-not $openMutexLine -or -not $taskkillLine -or -not $copyLine -or
              $openMutexLine -ge $copyLine -or $taskkillLine -ge $copyLine) {
            throw "The installer must open the instance mutex (line $openMutexLine) and taskkill the running copy (line $taskkillLine) before the first File /r (line $copyLine)."
          }

          # A manual uninstall must remove the auto-start entry and logs. The migration hook sets
          # a process-local environment variable while it invokes the old uninstaller, so upgrades
          # preserve both; this gate checks the cleanup and both sides of that contract are present.
          $uninstallSectionLine = ($executableScript |
            Select-String -Pattern '^\s*Section\s+"?Uninstall"?\s*$' |
            Select-Object -First 1).LineNumber
          $uninstallSectionEndLine = ($executableScript |
            Select-String -Pattern '^\s*SectionEnd\s*$' |
            Where-Object { $_.LineNumber -gt $uninstallSectionLine } |
            Select-Object -First 1).LineNumber
          $runDeleteLine = ($executableScript |
            Select-String -Pattern '^\s*DeleteRegValue\s+HKCU\s+"Software\\Microsoft\\Windows\\CurrentVersion\\Run"\s+"AirPodsWindows"\s*$' |
            Select-Object -First 1).LineNumber
          $roamingLogDeleteLine = ($executableScript |
            Select-String -Pattern '^\s*RMDir\s+/r\s+"\$APPDATA\\AirPodsWindows"\s*$' |
            Select-Object -First 1).LineNumber
          $localLogDeleteLine = ($executableScript |
            Select-String -Pattern '^\s*RMDir\s+/r\s+"\$LOCALAPPDATA\\AirPodsWindows"\s*$' |
            Select-Object -First 1).LineNumber
          $userContextLine = ($executableScript |
            Select-String -Pattern '^\s*SetShellVarContext\s+current\s*$' |
            Select-Object -First 1).LineNumber
          $restoredContextLine = ($executableScript |
            Select-String -Pattern '^\s*SetShellVarContext\s+all\s*$' |
            Where-Object { $_.LineNumber -gt $localLogDeleteLine -and
              $_.LineNumber -lt $uninstallSectionEndLine } |
            Select-Object -First 1).LineNumber
          if (-not $uninstallSectionLine -or -not $uninstallSectionEndLine -or
              -not $runDeleteLine -or -not $roamingLogDeleteLine -or
              -not $localLogDeleteLine -or -not $userContextLine -or
              -not $restoredContextLine -or
              $runDeleteLine -le $uninstallSectionLine -or
              $roamingLogDeleteLine -le $uninstallSectionLine -or
              $localLogDeleteLine -le $uninstallSectionLine -or
              $userContextLine -le $uninstallSectionLine -or
              $userContextLine -ge $runDeleteLine -or
              $userContextLine -ge $roamingLogDeleteLine -or
              $userContextLine -ge $localLogDeleteLine -or
              $restoredContextLine -le $runDeleteLine -or
              $restoredContextLine -le $roamingLogDeleteLine -or
              $restoredContextLine -le $localLogDeleteLine -or
              $runDeleteLine -ge $uninstallSectionEndLine -or
              $roamingLogDeleteLine -ge $uninstallSectionEndLine -or
              $localLogDeleteLine -ge $uninstallSectionEndLine -or
              $userContextLine -ge $uninstallSectionEndLine -or
              $restoredContextLine -ge $uninstallSectionEndLine) {
            throw "The uninstall section (lines $uninstallSectionLine-$uninstallSectionEndLine) must switch to the current user (line $userContextLine), remove the Run value (line $runDeleteLine), roaming logs (line $roamingLogDeleteLine) and legacy local logs (line $localLogDeleteLine), then restore all-users context (line $restoredContextLine)."
          }
          $migrationEnvSetLine = ($executableScript |
            Select-String -Pattern '^\s*System::Call .*SetEnvironmentVariable.*AirPodsWindowsMigration.*"1"' |
            Select-Object -First 1).LineNumber
          $migrationEnvFailCmpLine = ($executableScript |
            Select-String -Pattern '^\s*StrCmp\s+\$0\s+0\s+apd_migration_guard_failed\s*$' |
            Select-Object -First 1).LineNumber
          $migrationExecLine = ($executableScript |
            Select-String -Pattern '^\s*ExecWait\s+.*\/S.*_\?=\$R6' |
            Select-Object -First 1).LineNumber
          $migrationEnvClearLine = ($executableScript |
            Select-String -Pattern '^\s*System::Call .*SetEnvironmentVariable.*AirPodsWindowsMigration.*""' |
            Select-Object -First 1).LineNumber
          $migrationEnvDoneGotoLine = ($executableScript |
            Select-String -Pattern '^\s*Goto\s+apd_migration_guard_done\s*$' |
            Select-Object -First 1).LineNumber
          $migrationEnvFailLabelLine = ($executableScript |
            Select-String -Pattern '^\s*apd_migration_guard_failed:\s*$' |
            Select-Object -First 1).LineNumber
          $migrationEnvAbortLine = ($executableScript |
            Select-String -Pattern '^\s*Abort\s*$' |
            Where-Object { $_.LineNumber -gt $migrationEnvFailLabelLine } |
            Select-Object -First 1).LineNumber
          $migrationEnvDoneLabelLine = ($executableScript |
            Select-String -Pattern '^\s*apd_migration_guard_done:\s*$' |
            Select-Object -First 1).LineNumber
          $migrationGuardLine = ($executableScript |
            Select-String -Pattern '^\s*ReadEnvStr\s+\$R0\s+"AirPodsWindowsMigration"\s*$' |
            Select-Object -First 1).LineNumber
          $migrationGuardCmpLine = ($executableScript |
            Select-String -Pattern '^\s*StrCmp\s+\$R0\s+"1"\s+apd_keep_user_data\s*$' |
            Select-Object -First 1).LineNumber
          if (-not $migrationEnvSetLine -or -not $migrationEnvFailCmpLine -or
              -not $migrationExecLine -or -not $migrationEnvClearLine -or
              -not $migrationEnvDoneGotoLine -or -not $migrationEnvFailLabelLine -or
              -not $migrationEnvAbortLine -or -not $migrationEnvDoneLabelLine -or
              -not $migrationGuardLine -or -not $migrationGuardCmpLine -or
              $migrationEnvSetLine -ge $migrationEnvFailCmpLine -or
              $migrationEnvFailCmpLine -ge $migrationExecLine -or
              $migrationExecLine -ge $migrationEnvClearLine -or
              $migrationEnvClearLine -ge $migrationEnvDoneGotoLine -or
              $migrationEnvDoneGotoLine -ge $migrationEnvDoneLabelLine -or
              $migrationEnvFailLabelLine -le $migrationExecLine -or
              $migrationEnvAbortLine -le $migrationEnvFailLabelLine -or
              $migrationEnvAbortLine -ge $migrationEnvDoneLabelLine -or
              $migrationGuardLine -le $uninstallSectionLine -or
              $migrationGuardLine -ge $migrationGuardCmpLine -or
              $migrationGuardCmpLine -le $uninstallSectionLine -or
              $migrationGuardCmpLine -ge $userContextLine -or
              $migrationGuardLine -ge $uninstallSectionEndLine -or
              $migrationGuardCmpLine -ge $uninstallSectionEndLine) {
            throw "The migration environment set/failure-guard/exec/clear lines ($migrationEnvSetLine/$migrationEnvFailCmpLine/$migrationExecLine/$migrationEnvClearLine) must abort on guard failure, and the uninstall guard lines ($migrationGuardLine/$migrationGuardCmpLine) must run before cleanup inside the uninstall section."
          }
          $requiredRuntimeFiles = @(
            'AirPodsWindows.exe',
            'Animations.rcc',
            'Qt6Core.dll',
            'platforms/qwindows.dll',
            'iconengines/qsvgicon.dll',
            'imageformats/qsvg.dll',
            'multimedia/ffmpegmediaplugin.dll'
          )
          foreach ($relativePath in $requiredRuntimeFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $portableSource $relativePath))) {
              throw "Required deployed runtime is missing: $relativePath"
            }
          }
          $forbiddenPackagePattern =
            '(?i)((^|[\\/])[^\\/]*(test|mock|simulat(?:or|ion)|fixture|harness|validation)[^\\/]*($|[\\/])|(^|[\\/])[^\\/]+\.(pdb|ilk|lib|exp)$)'
          $forbiddenPackageEntries = Get-ChildItem -LiteralPath $portableSource -Recurse -Force |
            ForEach-Object {
              [IO.Path]::GetRelativePath($portableSource, $_.FullName)
            } |
            Where-Object { $_ -match $forbiddenPackagePattern }
          if ($forbiddenPackageEntries) {
            throw "Production package contains forbidden test or simulation artifacts: $($forbiddenPackageEntries -join ', ')"
          }

          $dumpbin = Get-ChildItem `
            "${env:ProgramFiles}/Microsoft Visual Studio/2022/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found on the runner.'
          }
          $applicationHeaders = & $dumpbin.FullName /headers (Join-Path $portableSource 'AirPodsWindows.exe')
          $installerHeaders = & $dumpbin.FullName /headers $installer.FullName
          if (($applicationHeaders -join "`n") -notmatch 'machine \(x64\)') {
            throw 'The packaged application is not x64.'
          }
          if (($installerHeaders -join "`n") -notmatch 'machine \(x86\)') {
            throw 'The NSIS compatibility bootstrap is not Win32-launchable.'
          }

          New-Item -ItemType Directory -Path dist | Out-Null
          $installerDestination = "dist/AirPodsWindows-$env:VERSION-win64.exe"
          $portableDestination = "dist/AirPodsWindows-$env:VERSION-win64-portable.zip"
          Copy-Item -LiteralPath $installer.FullName -Destination $installerDestination
          Compress-Archive -Path "$portableSource/*" -DestinationPath $portableDestination

      - name: Sign release installer when configured
        id: signing
        if: github.ref_type == 'tag'
        timeout-minutes: 15
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both Windows code-signing secrets or leave both unset.'
          }
          if (-not $hasCertificate) {
            Write-Warning 'Code-signing secrets are not configured; the draft release will contain unsigned installers.'
            "signed=false" >> $env:GITHUB_OUTPUT
            return
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'AirPodsWindows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x86/signtool.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw 'signtool.exe was not found on the runner.'
            }

            $installer = Get-ChildItem dist/AirPodsWindows-*-win64.exe | Select-Object -First 1
            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath `
              /p $env:SIGNING_CERTIFICATE_PASSWORD `
              $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE."
            }

            & $signTool.FullName verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed with exit code $LASTEXITCODE."
            }
            "signed=true" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Create Win32 update bridge
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $source = "dist/AirPodsWindows-$env:VERSION-win64.exe"
          $bridge = "dist/AirPodsWindows-$env:VERSION-win32-bridge.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Signed x64 installer not found: $source"
          }
          Copy-Item -LiteralPath $source -Destination $bridge
          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $bridgeHash = (Get-FileHash -LiteralPath $bridge -Algorithm SHA256).Hash
          if ($sourceHash -ne $bridgeHash) {
            throw 'The Win32 bridge does not contain the signed x64 installer byte-for-byte.'
          }

      - name: Verify release installer signatures
        if: github.ref_type == 'tag' && steps.signing.outputs.signed == 'true'
        timeout-minutes: 15
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x86/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw 'signtool.exe was not found on the runner.'
          }
          Get-ChildItem dist/AirPodsWindows-*.exe | ForEach-Object {
            & $signTool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($_.Name)."
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        timeout-minutes: 20
        with:
          name: AirPodsWindows-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        timeout-minutes: 10
        with:
          name: AirPodsWindows-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Create draft GitHub Release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/AirPodsWindows-${{ needs.build.outputs.version }}-win64.exe"
          "dist/AirPodsWindows-${{ needs.build.outputs.version }}-win64-portable.zip"
          "dist/AirPodsWindows-${{ needs.build.outputs.version }}-win32-bridge.exe"
          --repo "${{ github.repository }}"
          --draft
          --verify-tag
          --generate-notes
          --title "AirPodsWindows ${{ github.ref_name }}"
